[package]
name = "flakes"
version = "3.2.27"
edition = "2021"

[lib]
crate-type = ["lib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
log = { version = "0.4" }
thiserror = { version = "1.0" }
serde-saphyr = { version = "2.1", default-features = false, features = ["serialize", "deserialize"] }
which = { version = "4.2" }
lazy_static = { version = "1.4" }
regex = { version = "1.9" }
uzers = { version = "0.12" }
rust-ini = { version = "0.21" }
libc = { version = "0.2" }

[dev-dependencies]
tempfile = { version = "3.4" }

[features]
json = ["serde_json"]
