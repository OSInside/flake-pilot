<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1552" viewBox="0 0 1360 1552">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6cb0"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e08e0b"/>
    </marker>
    <style>
      .panel  { fill: #e8f1fb; stroke: #cfe0f4; stroke-width: 3; }
      .box    { fill: #ffffff; stroke: #2c5f9e; stroke-width: 3; }
      .inner  { fill: #f7fbff; stroke: #2c5f9e; stroke-width: 3; }
      .chip   { fill: #f7fbff; stroke: #2c5f9e; stroke-width: 3; }
      .icon   { fill: #dbeafe; stroke: #2c5f9e; stroke-width: 3; }
      .link   { stroke: #2c6cb0; stroke-width: 4; fill: none; }
      .back   { stroke: #e08e0b; stroke-width: 4; fill: none; }
      .head   { font: bold 38px 'Adwaita Sans', sans-serif; fill: #24527f; }
      .sub    { font: 23px 'Adwaita Sans', sans-serif; fill: #4a6a8a; }
      .title  { font: bold 28px 'Adwaita Sans', sans-serif; fill: #10263d; }
      .mono   { font: 23px 'Source Code Pro', monospace; fill: #10263d; }
      .monob  { font: bold 25px 'Source Code Pro', monospace; fill: #10263d; }
      .monoc  { font: bold 20px 'Source Code Pro', monospace; fill: #10263d; }
      .monos  { font: 19px 'Source Code Pro', monospace; fill: #4a6a8a; }
      .note   { font: 23px 'Adwaita Sans', sans-serif; fill: #10263d; }
      .tiny   { font: 20px 'Adwaita Sans', sans-serif; fill: #4a6a8a; }
      .amber  { font: bold 23px 'Source Code Pro', monospace; fill: #b8720a; }
      .blue   { font: bold 23px 'Source Code Pro', monospace; fill: #24527f; }
    </style>
  </defs>

  <rect width="1360" height="1552" fill="#ffffff"/>

  <!-- ================================ Host ================================ -->
  <rect class="panel" x="24" y="64" width="1266" height="942" rx="22"/>
  <text class="head" x="657" y="114" text-anchor="middle">Host</text>
  <text class="sub"  x="657" y="150" text-anchor="middle">the application is not installed here, only the link and its configuration</text>

  <!-- ============================= application ============================ -->
  <rect class="box" x="508" y="186" width="750" height="118" rx="16"/>
  <text class="monob" x="883" y="238" text-anchor="middle">&lt;app&gt; [arguments]</text>
  <text class="sub"   x="883" y="276" text-anchor="middle">the user calls the registered name in the shell</text>

  <path class="link" d="M 883 304 L 883 356" marker-end="url(#arrow)"/>
  <text class="tiny" x="900" y="340">executes</text>

  <!-- =============================== the link ============================= -->
  <rect class="box" x="508" y="360" width="750" height="126" rx="16"/>
  <text class="monob" x="883" y="412" text-anchor="middle">/path/to/&lt;app&gt; &#8594; /usr/bin/&lt;engine&gt;-pilot</text>
  <text class="sub"   x="883" y="452" text-anchor="middle">symbolic link, created at registration time</text>

  <path class="link" d="M 883 486 L 883 538" marker-end="url(#arrow)"/>
  <text class="tiny" x="900" y="522">the link starts the pilot</text>

  <!-- =============================== the pilot ============================ -->
  <rect class="box" x="508" y="542" width="750" height="200" rx="16"/>
  <text class="title" x="883" y="588" text-anchor="middle">Pilot</text>
  <text class="sub"   x="883" y="624" text-anchor="middle">reads the configuration of the name it was called by</text>

  <rect class="chip" x="528" y="644" width="232" height="78" rx="12"/>
  <text class="monoc" x="644" y="690" text-anchor="middle">podman-pilot</text>
  <rect class="chip" x="767" y="644" width="232" height="78" rx="12"/>
  <text class="monoc" x="883" y="690" text-anchor="middle">firecracker-pilot</text>
  <rect class="chip" x="1006" y="644" width="232" height="78" rx="12"/>
  <text class="monoc" x="1122" y="690" text-anchor="middle">bubblewrap-pilot</text>

  <path class="link" d="M 883 742 L 883 794" marker-end="url(#arrow)"/>
  <text class="tiny" x="900" y="778">provisions the instance</text>

  <!-- =============================== the engine =========================== -->
  <rect class="box" x="508" y="798" width="750" height="176" rx="16"/>
  <text class="title" x="883" y="844" text-anchor="middle">Engine</text>

  <rect class="chip" x="528" y="864" width="232" height="90" rx="12"/>
  <text class="monoc" x="644" y="900" text-anchor="middle">podman</text>
  <text class="tiny"  x="644" y="932" text-anchor="middle">shared host kernel</text>
  <rect class="chip" x="767" y="864" width="232" height="90" rx="12"/>
  <text class="monoc" x="883" y="900" text-anchor="middle">firecracker</text>
  <text class="tiny"  x="883" y="932" text-anchor="middle">own kernel on KVM</text>
  <rect class="chip" x="1006" y="864" width="232" height="90" rx="12"/>
  <text class="monoc" x="1122" y="900" text-anchor="middle">bubblewrap</text>
  <text class="tiny"  x="1122" y="932" text-anchor="middle">host tree overlay</text>

  <!-- ======================= registration and registry ==================== -->
  <rect class="box" x="56" y="360" width="356" height="126" rx="16"/>
  <text class="monob" x="234" y="412" text-anchor="middle">flake-ctl</text>
  <text class="sub"   x="234" y="452" text-anchor="middle">register, remove, list</text>

  <path class="link" d="M 412 423 L 502 423" marker-end="url(#arrow)"/>
  <text class="tiny" x="457" y="406" text-anchor="middle">creates</text>

  <path class="link" d="M 234 486 L 234 538" marker-end="url(#arrow)"/>
  <text class="tiny" x="252" y="522">writes</text>

  <rect class="box" x="56" y="542" width="356" height="200" rx="16"/>
  <text class="title" x="234" y="588" text-anchor="middle">Flake registry</text>
  <text class="monos" x="234" y="626" text-anchor="middle">/usr/share/flakes/&lt;app&gt;.yaml</text>
  <text class="monos" x="234" y="656" text-anchor="middle">~/.config/flakes/&lt;app&gt;.yaml</text>
  <text class="tiny"  x="234" y="696" text-anchor="middle">image, target program and</text>
  <text class="tiny"  x="234" y="722" text-anchor="middle">engine options of the flake</text>

  <path class="link" d="M 412 654 L 502 654" marker-end="url(#arrow)"/>
  <text class="tiny" x="457" y="637" text-anchor="middle">reads</text>

  <!-- ============================== image sources ========================= -->
  <rect class="box" x="56" y="798" width="356" height="176" rx="16"/>
  <text class="title" x="234" y="844" text-anchor="middle">Image sources</text>
  <text class="mono"  x="234" y="886" text-anchor="middle">OCI registry</text>
  <text class="mono"  x="234" y="920" text-anchor="middle">local archive</text>
  <text class="mono"  x="234" y="954" text-anchor="middle">host directory tree</text>

  <path class="link" d="M 412 886 L 502 886" marker-end="url(#arrow)"/>

  <!-- =========================== into the instance ======================== -->
  <path class="link" d="M 883 974 L 883 1062" marker-end="url(#arrow)"/>
  <text class="tiny" x="900" y="1036">creates the instance</text>

  <!-- ====================== isolated runtime environment ================== -->
  <rect class="panel" x="24" y="1070" width="1266" height="314" rx="22"/>
  <text class="head" x="657" y="1124" text-anchor="middle">Isolated runtime environment</text>
  <text class="sub"  x="657" y="1160" text-anchor="middle">the target program runs here, with the arguments and the data of the calling user</text>

  <!-- container -->
  <rect class="box" x="56" y="1182" width="387" height="170" rx="16"/>
  <rect class="icon" x="80" y="1198" width="56" height="12" rx="3"/>
  <rect class="icon" x="80" y="1215" width="56" height="12" rx="3"/>
  <rect class="icon" x="80" y="1232" width="56" height="12" rx="3"/>
  <text class="title" x="152" y="1222">Container</text>
  <text class="sub"   x="152" y="1256">shares the host kernel</text>
  <rect class="inner" x="80" y="1274" width="339" height="56" rx="10"/>
  <text class="mono" x="249" y="1311" text-anchor="middle">/path/to/&lt;app&gt;</text>

  <!-- virtual machine -->
  <rect class="box" x="463" y="1182" width="387" height="170" rx="16"/>
  <rect class="icon" x="487" y="1198" width="56" height="40" rx="5"/>
  <path d="M 515 1238 L 515 1248 M 499 1248 L 531 1248" stroke="#2c5f9e"
        stroke-width="3" fill="none"/>
  <text class="title" x="559" y="1222">Virtual machine</text>
  <text class="sub"   x="559" y="1256">own kernel on KVM</text>
  <rect class="inner" x="487" y="1274" width="339" height="56" rx="10"/>
  <text class="mono" x="656" y="1311" text-anchor="middle">/path/to/&lt;app&gt;</text>

  <!-- sandbox -->
  <rect class="box" x="870" y="1182" width="387" height="170" rx="16"/>
  <rect class="icon" x="894" y="1198" width="56" height="46" rx="8"/>
  <rect x="907" y="1211" width="30" height="20" rx="4" fill="#ffffff"
        stroke="#2c5f9e" stroke-width="3" stroke-dasharray="5 4"/>
  <text class="title" x="966" y="1222">Sandbox</text>
  <text class="sub"   x="966" y="1256">overlay of a host tree</text>
  <rect class="inner" x="894" y="1274" width="339" height="56" rx="10"/>
  <text class="mono" x="1063" y="1311" text-anchor="middle">/path/to/&lt;app&gt;</text>

  <!-- ======================= result back to the caller ==================== -->
  <path class="back" d="M 1257 1265 L 1308 1265 L 1308 245 L 1262 245"
        marker-end="url(#arrow-amber)"/>
  <text class="note" x="1348" y="755" text-anchor="middle"
        transform="rotate(-90 1348 755)">output and exit code</text>

  <!-- ================================ legend ============================== -->
  <rect class="box" x="24" y="1410" width="1266" height="110" rx="22"/>
  <circle cx="64" cy="1446" r="9" fill="#2c6cb0"/>
  <text class="blue" x="92" y="1455">flake-ctl</text>
  <text class="note" x="250" y="1455">registers an application, creates the link and its configuration</text>
  <circle cx="64" cy="1484" r="9" fill="#e08e0b"/>
  <text class="amber" x="92" y="1493">pilot</text>
  <text class="note"  x="250" y="1493">runs on every call, provisions the instance and passes output and exit code through</text>
</svg>
