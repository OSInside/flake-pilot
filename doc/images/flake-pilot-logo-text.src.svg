<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flake Pilot logo with wordmark, source file

  The icon is a copy of flake-pilot-logo.svg. The wordmark
  flake-pilot-logo-text.svg is created from this file by inkscape
  with the text converted to paths, such that the logo does not
  depend on installed fonts. See the logo target in the Makefile
  of the user guide
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="400" viewBox="0 0 1200 400">
  <title>Flake Pilot</title>
  <g transform="translate(20 20) scale(0.703125)">
    <defs>
      <radialGradient id="wm-badge" cx="50%" cy="40%" r="60%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#e8f1fb"/>
      </radialGradient>
      <!-- one arm, pointing up, rotated six times around the center -->
      <g id="wm-arm">
        <rect x="240" y="28" width="32" height="84" rx="16" fill="#24527f"/>
        <g stroke="#2c6cb0" stroke-width="18" stroke-linecap="round" fill="none">
          <path d="M 256 256 L 256 120"/>
        </g>
        <g stroke="#2c6cb0" stroke-width="13" stroke-linecap="round"
           stroke-linejoin="round" fill="none">
          <path d="M 226 132 L 256 162 L 286 132"/>
          <path d="M 236 184 L 256 204 L 276 184"/>
        </g>
      </g>
    </defs>

    <circle cx="256" cy="256" r="248" fill="url(#wm-badge)" stroke="#cfe0f4" stroke-width="6"/>

    <use xlink:href="#wm-arm"/>
    <use xlink:href="#wm-arm" transform="rotate(60 256 256)"/>
    <use xlink:href="#wm-arm" transform="rotate(120 256 256)"/>
    <use xlink:href="#wm-arm" transform="rotate(180 256 256)"/>
    <use xlink:href="#wm-arm" transform="rotate(240 256 256)"/>
    <use xlink:href="#wm-arm" transform="rotate(300 256 256)"/>

    <!-- the rim of the helm -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="#24527f" stroke-width="22"/>

    <!-- the hub -->
    <polygon points="256,208 297.6,232 297.6,280 256,304 214.4,280 214.4,232"
             fill="#e08e0b" stroke="#b8720a" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="256" cy="256" r="17" fill="#ffffff"/>
  </g>
  <text x="420" y="238" font-family="'Adwaita Sans', sans-serif" font-size="150"
        font-weight="bold" letter-spacing="-2"><tspan fill="#24527f">flake</tspan><tspan fill="#e08e0b">pilot</tspan></text>
  <text x="426" y="306" font-family="'Adwaita Sans', sans-serif" font-size="41"
        fill="#4a6a8a">Secure Execution with a Native Feel</text>
</svg>
