<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flake Pilot logo

  A ship's helm whose six spokes are the arms of a snowflake:
  the pilot steering the flakes. The amber hub is the launch
  point every flake passes through
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 512 512">
  <title>Flake Pilot</title>
  <defs>
    <radialGradient id="badge" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f1fb"/>
    </radialGradient>
    <!-- one arm, pointing up, rotated six times around the center -->
    <g id="arm">
      <rect x="240" y="28" width="32" height="84" rx="16" fill="#24527f"/>
      <g stroke="#2c6cb0" stroke-width="18" stroke-linecap="round" fill="none">
        <path d="M 256 256 L 256 120"/>
      </g>
      <g stroke="#2c6cb0" stroke-width="13" stroke-linecap="round"
         stroke-linejoin="round" fill="none">
        <path d="M 226 132 L 256 162 L 286 132"/>
        <path d="M 236 184 L 256 204 L 276 184"/>
      </g>
    </g>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#badge)" stroke="#cfe0f4" stroke-width="6"/>

  <use xlink:href="#arm"/>
  <use xlink:href="#arm" transform="rotate(60 256 256)"/>
  <use xlink:href="#arm" transform="rotate(120 256 256)"/>
  <use xlink:href="#arm" transform="rotate(180 256 256)"/>
  <use xlink:href="#arm" transform="rotate(240 256 256)"/>
  <use xlink:href="#arm" transform="rotate(300 256 256)"/>

  <!-- the rim of the helm -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#24527f" stroke-width="22"/>

  <!-- the hub -->
  <polygon points="256,208 297.6,232 297.6,280 256,304 214.4,280 214.4,232"
           fill="#e08e0b" stroke="#b8720a" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="17" fill="#ffffff"/>
</svg>
