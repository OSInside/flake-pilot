include:
  tar: ~
  path: ~
vm:
  name: name
  target_app_path: path/to/program/in/container
  host_app_path: path/to/program/on/host
  base_vm: ~
  layers: ~
  runtime:
    runas: root
    resume: false
    force_vsock: false
    # Optional pilot options which are always effective for this
    # application. The same options can be given at call time and
    # then take precedence over the setting here, e.g:
    #
    # pilot_options:
    #   - "%port:2000"
    pilot_options: ~
    firecracker:
      boot_args:
        - "init=/usr/sbin/sci"
        - "console=ttyS0"
        - "root=/dev/vda"
        - "acpi=off"
        - "rd.neednet=1"
        - "ip=dhcp"
        - "quiet"
      overlay_size: ~
      rootfs_image_path: ~
      kernel_image_path: ~
      initrd_path: ~
      mem_size_mib: 4096
      vcpu_count: 2
      cache_type: ~
      # Optional instance specific settings, keyed by the @NAME
      # instance selector used to call the app. A boot_args option
      # set here replaces the global setting of the same option for
      # this instance. Options not set globally are appended, e.g:
      #
      # instance:
      #   "@id":
      #     boot_args:
      #       - "ip=172.16.0.2::172.16.0.1:255.255.255.0::eth0:off"
      instance: ~
