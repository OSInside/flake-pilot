[package]
name = "flake-pilot-helper"
version = "3.2.21"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "3.0", features = ["derive"] }
log = { version = "0.4" }
env_logger = { version = "0.9" }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["serialize", "deserialize"] }
flakes = { version = "3.2.21", path = "../common" }
uzers = { version = "0.12" }
libc = { version = "0.2" }
tempfile = { version = "3.4" }
