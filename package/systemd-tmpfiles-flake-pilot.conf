# Meta data directory shared by the pilots of all users, see
# podman_ids_dir, firecracker_ids_dir and bubblewrap_ids_dir in
# /etc/flakes.yml. Every user keeps a private directory below it.
# It has to belong to root as the owner of a sticky directory may
# delete and replace the entries of all other users in it. Created
# at boot, the pilots never have to create it on demand, which
# requires root privileges
d /tmp/flakes 1777 root root -
